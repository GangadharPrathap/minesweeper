<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futuristic Minesweeper</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #1a1a2e;
            --primary-color: #0f3460;
            --secondary-color: #e94560;
            --accent-color: #16213e;
            --text-color: #fff;
            --neon-blue: #00e5ff;
            --neon-green: #39ff14;
            --neon-purple: #8a2be2;
        }

        body {
            font-family: 'Orbitron', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            overflow: hidden;
            box-sizing: border-box;
        }

        #game-container {
            width: 100%;
            max-width: 600px;
            background-color: var(--accent-color);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.4);
            border: 2px solid var(--neon-blue);
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: relative;
        }

        h1 {
            text-align: center;
            color: var(--neon-blue);
            text-shadow: 0 0 10px var(--neon-blue), 0 0 20px var(--neon-blue);
            margin: 0 0 10px;
            font-size: 2em;
        }

        #control-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--primary-color);
            padding: 10px;
            border-radius: 10px;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--neon-blue);
        }

        .display {
            background-color: var(--bg-color);
            color: var(--neon-green);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 1.2em;
            letter-spacing: 2px;
            border: 1px solid var(--neon-green);
            box-shadow: 0 0 5px var(--neon-green);
        }

        #message {
            text-align: center;
            min-height: 2em;
            color: var(--neon-blue);
            font-size: 1.5em;
            font-weight: bold;
            text-shadow: 0 0 10px var(--neon-blue);
        }

        .buttons {
            display: flex;
            gap: 10px;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        .difficulty-button {
            background: linear-gradient(45deg, #4c2d82, #6b4c9c);
            color: var(--text-color);
            border: 1px solid var(--neon-purple);
            box-shadow: 0 0 10px var(--neon-purple);
        }

        .difficulty-button:hover {
            transform: translateY(-2px);
            background: linear-gradient(45deg, #6b4c9c, #8c6daf);
            box-shadow: 0 0 15px var(--neon-purple);
        }

        #new-game-btn {
            background: linear-gradient(45deg, #00bfff, #0080ff);
            color: var(--text-color);
            border: 1px solid var(--neon-blue);
            box-shadow: 0 0 10px var(--neon-blue);
        }

        #new-game-btn:hover {
            transform: translateY(-2px);
            background: linear-gradient(45deg, #00d7ff, #0095ff);
            box-shadow: 0 0 15px var(--neon-blue);
        }

        #board {
            display: grid;
            gap: 2px;
            border: 2px solid var(--neon-blue);
            padding: 5px;
            background-color: var(--primary-color);
            border-radius: 10px;
        }

        .cell {
            background: linear-gradient(45deg, #16213e, #0f3460);
            border: 1px solid rgba(0, 229, 255, 0.2);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5em;
            cursor: pointer;
            user-select: none;
            transition: background-color 0.1s ease-in-out, transform 0.1s ease-in-out;
            aspect-ratio: 1 / 1; /* Make cells square */
        }

        .cell:hover:not(.revealed) {
            background: linear-gradient(45deg, #1f2a4a, #163e6e);
        }

        .revealed {
            background-color: #2b395e;
            cursor: default;
            box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 229, 255, 0.1);
        }

        .mine {
            background-color: #e94560;
            color: black;
            box-shadow: 0 0 10px var(--secondary-color);
        }

        .flagged {
            color: var(--neon-green);
        }

        /* Number colors with a glowing effect */
        .value-1 { color: #00e5ff; text-shadow: 0 0 5px #00e5ff; }
        .value-2 { color: #39ff14; text-shadow: 0 0 5px #39ff14; }
        .value-3 { color: #ff0077; text-shadow: 0 0 5px #ff0077; }
        .value-4 { color: #8a2be2; text-shadow: 0 0 5px #8a2be2; }
        .value-5 { color: #ffb300; text-shadow: 0 0 5px #ffb300; }
        .value-6 { color: #00ffff; text-shadow: 0 0 5px #00ffff; }
        .value-7 { color: #ff00ff; text-shadow: 0 0 5px #ff00ff; }
        .value-8 { color: #ffffff; text-shadow: 0 0 5px #ffffff; }

        /* Modal styling */
        #modal {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: var(--accent-color);
            border: 2px solid var(--neon-blue);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.6);
            z-index: 1000;
            text-align: center;
        }

        #modal-message {
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 20px;
        }

        #modal-btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            background: linear-gradient(45deg, #00bfff, #0080ff);
            color: var(--text-color);
            cursor: pointer;
            box-shadow: 0 0 10px var(--neon-blue);
        }

        #overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 999;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            #game-container {
                padding: 15px;
            }
            h1 {
                font-size: 1.5em;
            }
            #control-panel {
                flex-direction: column;
                gap: 10px;
            }
            .display {
                font-size: 1em;
                padding: 6px 10px;
            }
            .buttons {
                flex-wrap: wrap;
                justify-content: center;
            }
            .cell {
                font-size: 1.2em;
            }
            #modal-message {
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <h1>MINESWEEPER</h1>
        <div id="message">Select a difficulty to start!</div>
        <div id="difficulty-selector" class="buttons">
            <button class="difficulty-button" data-difficulty="easy">Easy</button>
            <button class="difficulty-button" data-difficulty="medium">Medium</button>
            <button class="difficulty-button" data-difficulty="hard">Hard</button>
        </div>

        <div id="control-panel">
            <div id="mine-count" class="display">MINES: 0</div>
            <button id="new-game-btn">New Game</button>
            <div id="timer" class="display">TIME: 000</div>
        </div>

        <div id="board"></div>
    </div>

    <div id="overlay"></div>
    <div id="modal">
        <div id="modal-message">You Win!</div>
        <button id="modal-btn">New Game</button>
    </div>

    <script>
        // Game State Variables
        const boardElement = document.getElementById('board');
        const mineCountElement = document.getElementById('mine-count');
        const timerElement = document.getElementById('timer');
        const messageElement = document.getElementById('message');
        const newGameBtn = document.getElementById('new-game-btn');
        const difficultySelector = document.getElementById('difficulty-selector');
        const modal = document.getElementById('modal');
        const overlay = document.getElementById('overlay');
        const modalBtn = document.getElementById('modal-btn');

        let board;
        let rows;
        let cols;
        let mineCount;
        let timerInterval;
        let timeElapsed;
        let isGameOver;
        let revealedCount;

        const difficulties = {
            easy: { rows: 9, cols: 9, mines: 10 },
            medium: { rows: 16, cols: 16, mines: 40 },
            hard: { rows: 16, cols: 30, mines: 99 }
        };

        /**
         * Initializes a new game.
         * @param {string} difficulty - The selected difficulty level.
         */
        function init(difficulty) {
            const settings = difficulties[difficulty];
            rows = settings.rows;
            cols = settings.cols;
            mineCount = settings.mines;
            isGameOver = false;
            revealedCount = 0;

            // Set up the board grid dynamically
            boardElement.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
            boardElement.style.gridTemplateRows = `repeat(${rows}, 1fr)`;

            // Initialize the board data structure
            board = Array(rows).fill(0).map(() => Array(cols).fill({
                isMine: false,
                isRevealed: false,
                isFlagged: false,
                value: 0
            }));

            // Place mines
            placeMines();
            // Calculate numbers for non-mine cells
            calculateNumbers();

            // Render the initial HTML
            renderBoard();

            // Update UI elements
            mineCountElement.textContent = `MINES: ${mineCount}`;
            messageElement.textContent = 'Game in progress...';

            // Reset and start timer
            clearInterval(timerInterval);
            timeElapsed = 0;
            timerElement.textContent = 'TIME: 000';
            startTimer();
        }

        /**
         * Places mines randomly on the board.
         */
        function placeMines() {
            let minesPlaced = 0;
            while (minesPlaced < mineCount) {
                const row = Math.floor(Math.random() * rows);
                const col = Math.floor(Math.random() * cols);
                if (!board[row][col].isMine) {
                    board[row][col] = { ...board[row][col], isMine: true };
                    minesPlaced++;
                }
            }
        }

        /**
         * Calculates the number of adjacent mines for each cell.
         */
        function calculateNumbers() {
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (!board[r][c].isMine) {
                        let mineCount = 0;
                        for (let i = -1; i <= 1; i++) {
                            for (let j = -1; j <= 1; j++) {
                                const newRow = r + i;
                                const newCol = c + j;
                                if (newRow >= 0 && newRow < rows && newCol >= 0 && newCol < cols) {
                                    if (board[newRow][newCol].isMine) {
                                        mineCount++;
                                    }
                                }
                            }
                        }
                        board[r][c] = { ...board[r][c], value: mineCount };
                    }
                }
            }
        }

        /**
         * Renders the game board HTML.
         */
        function renderBoard() {
            boardElement.innerHTML = '';
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    cell.dataset.row = r;
                    cell.dataset.col = c;

                    const cellData = board[r][c];
                    if (cellData.isRevealed) {
                        cell.classList.add('revealed');
                        if (cellData.isMine) {
                            cell.classList.add('mine');
                            cell.innerHTML = '💣';
                        } else if (cellData.value > 0) {
                            cell.classList.add(`value-${cellData.value}`);
                            cell.textContent = cellData.value;
                        }
                    } else if (cellData.isFlagged) {
                        cell.classList.add('flagged');
                        cell.innerHTML = '🚩';
                    }
                    boardElement.appendChild(cell);
                }
            }
        }

        /**
         * Handles the left-click action on a cell.
         * @param {number} row - The row index.
         * @param {number} col - The column index.
         */
        function revealCell(row, col) {
            if (isGameOver || board[row][col].isRevealed || board[row][col].isFlagged) return;

            const cell = board[row][col];
            board[row][col] = { ...cell, isRevealed: true };
            revealedCount++;

            if (cell.isMine) {
                gameOver(false); // Game over, you hit a mine
                return;
            }

            // If the cell is empty (value 0), recursively reveal its neighbors
            if (cell.value === 0) {
                for (let i = -1; i <= 1; i++) {
                    for (let j = -1; j <= 1; j++) {
                        const newRow = row + i;
                        const newCol = col + j;
                        if (newRow >= 0 && newRow < rows && newCol >= 0 && newCol < cols) {
                            revealCell(newRow, newCol);
                        }
                    }
                }
            }

            // Re-render the board to reflect changes
            renderBoard();

            checkWin();
        }

        /**
         * Handles the right-click action to toggle a flag.
         * @param {number} row - The row index.
         * @param {number} col - The column index.
         */
        function toggleFlag(row, col) {
            if (isGameOver || board[row][col].isRevealed) return;

            const cell = board[row][col];
            const newFlaggedState = !cell.isFlagged;
            board[row][col] = { ...cell, isFlagged: newFlaggedState };

            // Update mine counter
            let flagsPlaced = board.flat().filter(c => c.isFlagged).length;
            mineCountElement.textContent = `MINES: ${mineCount - flagsPlaced}`;

            renderBoard();
            checkWin();
        }

        /**
         * Checks if the player has won the game.
         */
        function checkWin() {
            // A win condition is met when all non-mine cells have been revealed.
            const totalCells = rows * cols;
            const nonMineCells = totalCells - mineCount;

            if (revealedCount === nonMineCells) {
                gameOver(true); // Game won
            }
        }

        /**
         * Ends the game and displays the final message.
         * @param {boolean} win - True if the player won, false otherwise.
         */
        function gameOver(win) {
            isGameOver = true;
            clearInterval(timerInterval);

            // Reveal all mines at the end of the game
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (board[r][c].isMine) {
                        board[r][c].isRevealed = true;
                    }
                }
            }
            renderBoard();

            showModal(win);
        }

        /**
         * Starts the game timer.
         */
        function startTimer() {
            timerInterval = setInterval(() => {
                timeElapsed++;
                timerElement.textContent = `TIME: ${String(timeElapsed).padStart(3, '0')}`;
            }, 1000);
        }

        /**
         * Displays the game over/win modal.
         * @param {boolean} win - True if the player won, false otherwise.
         */
        function showModal(win) {
            const finalMessage = win ? 'You Win! 🥳' : 'Game Over! 💥';
            modal.style.display = 'block';
            overlay.style.display = 'block';
            document.getElementById('modal-message').textContent = finalMessage;

            modalBtn.onclick = () => {
                modal.style.display = 'none';
                overlay.style.display = 'none';
                messageElement.textContent = 'Select a difficulty to start!';
            }
        }

        // --- Event Listeners ---

        // Board click listeners
        boardElement.addEventListener('click', (event) => {
            if (isGameOver) return;
            const cellElement = event.target.closest('.cell');
            if (cellElement) {
                const row = parseInt(cellElement.dataset.row);
                const col = parseInt(cellElement.dataset.col);
                revealCell(row, col);
            }
        });

        // Right-click listener to toggle flags
        boardElement.addEventListener('contextmenu', (event) => {
            if (isGameOver) return;
            event.preventDefault(); // Prevent the default context menu
            const cellElement = event.target.closest('.cell');
            if (cellElement) {
                const row = parseInt(cellElement.dataset.row);
                const col = parseInt(cellElement.dataset.col);
                toggleFlag(row, col);
            }
        });

        // New Game button listener
        newGameBtn.addEventListener('click', () => {
            messageElement.textContent = 'Select a difficulty to start!';
            boardElement.innerHTML = '';
            mineCountElement.textContent = 'MINES: 0';
            timerElement.textContent = 'TIME: 000';
            clearInterval(timerInterval);
        });

        // Difficulty selector buttons
        difficultySelector.addEventListener('click', (event) => {
            const difficultyBtn = event.target.closest('.difficulty-button');
            if (difficultyBtn) {
                const difficulty = difficultyBtn.dataset.difficulty;
                init(difficulty);
            }
        });

    </script>
</body>
</html>
